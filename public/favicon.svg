<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#030712" />
  
  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#glowRing)" stroke-width="2" opacity="0.8" />
  
  <!-- Center Orb -->
  <circle cx="32" cy="32" r="22" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Modern Phone Handset Path -->
  <path d="M38.8 35.8c-1.5 1.5-3.3 2.6-5.4 2.1-4.2-1.1-7.8-4.7-8.9-8.9-.5-2.1.6-3.9 2.1-5.4.8-.8 1.1-1.9.7-2.9l-1.2-3.1c-.5-1.3-1.8-2.1-3.2-1.9-2.3.3-4.3 1.9-4.8 4.2-.8 3.8.5 7.9 3.4 10.8 2.9 2.9 7 4.2 10.8 3.4 2.3-.5 3.9-2.5 4.2-4.8.2-1.4-.6-2.7-1.9-3.2l-3.1-1.2c-1-.4-2.1-.1-2.7.7z" fill="#ffffff" />
  
  <!-- Intelligence Signal Waves -->
  <path d="M36 21c3.5 1.5 6 5 6 9" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M40 17c5.2 2.2 9 7.5 9 13.5" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Active Status Green Dot -->
  <circle cx="48" cy="16" r="4.5" fill="#10b981" stroke="#030712" stroke-width="2" />
</svg>
